<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arena dos Lendários</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1230;font-family:system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(#13245fcc,#050a1de6);z-index:10}
.hide{display:none!important}
h1{margin:0;font-size:clamp(28px,8vh,64px);color:#ffc928;text-shadow:0 4px 0 #b36b00,0 0 24px #ff9a00;letter-spacing:2px;text-align:center}
h2{margin:0;font-size:clamp(20px,5vh,34px)}
.sub{color:#7fd0ff;margin-bottom:8px}
.btn{border:2px solid #3b6cff;background:#10205a;color:#fff;border-radius:12px;padding:12px 0;width:min(260px,60vw);font-size:18px;font-weight:700}
.btn.main{background:linear-gradient(#ffd23f,#ff9f00);color:#2a1700;border-color:#fff3b0}
.btn.off{opacity:.45}
.btn:active{transform:scale(.96)}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.bar{position:absolute;top:10px;width:36%;height:22px;background:#0008;border:2px solid #fff6;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .15s}
#b1{left:10px}#b1 i{background:linear-gradient(#5bff5b,#16a516)}
#b2{right:10px}#b2 i{background:linear-gradient(#ff6b6b,#b81616);margin-left:auto}
.bar span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:20px;font-weight:700}
#timer{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#0009;border:2px solid #fff4;border-radius:10px;padding:2px 14px;font-size:22px;font-weight:800;text-align:center}
#timer small{display:block;font-size:11px;font-weight:600;color:#7fd0ff;margin-top:-4px}
#stick{position:absolute;left:4vw;bottom:6vh;width:150px;height:150px;border-radius:50%;background:#ffffff22;border:3px solid #ffffff55;pointer-events:auto}
#knob{position:absolute;left:50px;top:50px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
.act{position:absolute;border-radius:50%;border:3px solid #fff8;color:#fff;font-weight:800;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center}
#atk{right:5vw;bottom:8vh;width:90px;height:90px;background:radial-gradient(#ff8a3d,#b02a00);font-size:15px}
#skl{right:calc(5vw + 100px);bottom:4vh;width:70px;height:70px;background:radial-gradient(#b980ff,#4a1a9c)}
#pause{position:absolute;top:44px;right:10px;width:44px;height:44px;background:#0009;font-size:18px}
#rot{position:fixed;inset:0;background:#050a1d;z-index:99;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="rot">📱 Gire o celular para o modo horizontal</div>

<div id="menu" class="ov">
  <h1>ARENA DOS<br>LENDÁRIOS</h1>
  <div class="sub">Lute • Evolua • Seja o Lendário</div>
  <button class="btn main" id="play">▶ JOGAR (Treino)</button>
  <button class="btn off">🛒 LOJA (em breve)</button>
  <button class="btn off">⚙ CONFIGURAÇÕES (em breve)</button>
  <div class="sub" style="font-size:12px">Online 1v1: em breve</div>
</div>

<div id="pm" class="ov hide">
  <h2>PAUSADO</h2>
  <button class="btn main" id="resume">CONTINUAR</button>
  <button class="btn" id="tomenu">VOLTAR AO MENU</button>
</div>

<div id="end" class="ov hide">
  <h1 id="endt">VITÓRIA</h1>
  <button class="btn main" id="again">JOGAR DE NOVO</button>
  <button class="btn" id="tomenu2">VOLTAR AO MENU</button>
</div>

<div id="hud" class="hide">
  <div class="bar" id="b1"><i></i><span>Kael 100/100</span></div>
  <div id="timer"><span id="tt">02:00</span><small>RONDA 1</small></div>
  <div class="bar" id="b2"><i></i><span>Ryuk 100/100</span></div>
  <button class="act" id="pause">II</button>
  <div id="stick"><div id="knob"></div></div>
  <button class="act" id="skl">🔥<br>Poder</button>
  <button class="act" id="atk">👊<br>Ataque</button>
</div>

<script type="module">
import * as THREE from 'three';

// ---------- Cena ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6ec6ff);
scene.fog = new THREE.Fog(0x8fd3ff, 25, 70);
const cam = new THREE.PerspectiveCamera(60, 1, .1, 200);

scene.add(new THREE.HemisphereLight(0xcfeaff, 0x556b3a, 1.0));
const sun = new THREE.DirectionalLight(0xfff0cc, 1.6);
sun.position.set(10,20,8); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});
scene.add(sun);

const mat = (c,o={}) => new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
const box = (w,h,d,m) => { const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); x.castShadow=x.receiveShadow=true; return x; };

// ---------- Arena ----------
const R = 14;
const floor = new THREE.Mesh(new THREE.CylinderGeometry(R,R+1,1,48), mat(0xb9a27c));
floor.position.y=-.5; floor.receiveShadow=true; scene.add(floor);
const ring = new THREE.Mesh(new THREE.TorusGeometry(R-1,.12,8,64), mat(0x35c0ff,{emissive:0x1a90ff,emissiveIntensity:1.5}));
ring.rotation.x=Math.PI/2; ring.position.y=.02; scene.add(ring);
const inner = new THREE.Mesh(new THREE.TorusGeometry(5,.1,8,48), mat(0xffc928,{emissive:0xff9a00,emissiveIntensity:1}));
inner.rotation.x=Math.PI/2; inner.position.y=.02; scene.add(inner);

// pilares com tochas
for(let i=0;i<8;i++){
  const a=i/8*Math.PI*2, x=Math.cos(a)*(R-.5), z=Math.sin(a)*(R-.5);
  const p=box(1.2,3,1.2,mat(0x6b6f7a)); p.position.set(x,1.5,z); scene.add(p);
  const f=new THREE.Mesh(new THREE.ConeGeometry(.35,.9,8), mat(0xff8a00,{emissive:0xff5a00,emissiveIntensity:2}));
  f.position.set(x,3.5,z); f.userData.fire=1; scene.add(f);
}
// ilhas flutuantes
for(let i=0;i<14;i++){
  const a=Math.random()*Math.PI*2, d=R+8+Math.random()*25;
  const s=3+Math.random()*5, y=-2+Math.random()*10;
  const top=box(s,.8,s,mat(0x4caf50)); const rock=box(s*.8,s*.7,s*.8,mat(0x7a6a5a));
  rock.position.y=-.75; top.add(rock);
  top.position.set(Math.cos(a)*d,y,Math.sin(a)*d); top.userData.float=Math.random()*6; scene.add(top);
}
// bandeiras
[[-1,0xd63a3a],[1,0x3a6ad6]].forEach(([s,c])=>{
  const b=box(.1,3,1.6,mat(c)); b.position.set(s*(R-.5),5,0); scene.add(b);
});

// ---------- Personagens (estilo bloco) ----------
function makeChar(shirt,hair,glow){
  const g=new THREE.Group();
  const skin=mat(0xf2c8a0), sm=mat(shirt,{emissive:glow,emissiveIntensity:.25}), pm=mat(0x1b1b2a);
  const torso=box(.9,1.1,.5,sm); torso.position.y=1.55; g.add(torso);
  const head=box(.7,.7,.7,skin); head.position.y=2.45; g.add(head);
  const hr=box(.78,.3,.78,mat(hair)); hr.position.y=2.85; g.add(hr);
  const arm=(x)=>{const p=new THREE.Group(); p.position.set(x,2,0);
    const a=box(.3,1,.3,sm); a.position.y=-.45; p.add(a);
    const h=box(.32,.32,.32,skin); h.position.y=-1; p.add(h); g.add(p); return p;};
  const leg=(x)=>{const p=new THREE.Group(); p.position.set(x,1,0);
    const l=box(.38,1,.38,pm); l.position.y=-.5; p.add(l); g.add(p); return p;};
  g.armL=arm(-.62); g.armR=arm(.62); g.legL=leg(-.22); g.legR=leg(.22);
  scene.add(g); return g;
}
const P = {g:makeChar(0xc02020,0x15151f,0xff2a00), hp:100, atkT:0, sklT:0, punch:0, vx:0, vz:0};
const E = {g:makeChar(0x2a62d6,0xe8eefc,0x2a9bff), hp:100, atkT:1.5, punch:0, vx:0, vz:0};

// ---------- Estado ----------
let state='menu', timeLeft=120, balls=[], t=0;

function reset(){
  P.g.position.set(-5,0,0); E.g.position.set(5,0,0);
  P.hp=E.hp=100; P.atkT=P.sklT=0; E.atkT=1.5; timeLeft=120;
  balls.forEach(b=>scene.remove(b.m)); balls=[]; hud();
}
const $=id=>document.getElementById(id);
function show(id,v){$(id).classList.toggle('hide',!v);}
function hud(){
  $('b1').firstChild.style.width=Math.max(P.hp,0)+'%';
  $('b2').firstChild.style.width=Math.max(E.hp,0)+'%';
  $('b1').lastChild.textContent='Kael '+Math.max(Math.ceil(P.hp),0)+'/100';
  $('b2').lastChild.textContent='Ryuk '+Math.max(Math.ceil(E.hp),0)+'/100';
  const m=Math.floor(timeLeft/60), s=Math.floor(timeLeft%60);
  $('tt').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function start(){ reset(); state='play'; show('menu',0);show('pm',0);show('end',0);show('hud',1); }
function finish(win){ state='end'; $('endt').textContent=win?'VITÓRIA':'DERROTA'; $('endt').style.color=win?'#ffc928':'#ff6b6b'; show('end',1); }
$('play').onclick=start; $('again').onclick=start;
$('pause').onclick=()=>{state='pause';show('pm',1)};
$('resume').onclick=()=>{state='play';show('pm',0)};
const toMenu=()=>{state='menu';show('pm',0);show('end',0);show('hud',0);show('menu',1)};
$('tomenu').onclick=toMenu; $('tomenu2').onclick=toMenu;

// ---------- Controles ----------
const mv={x:0,y:0}, keys={};
const stick=$('stick'), knob=$('knob'); let sid=null;
function setStick(e){
  const r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy; const m=Math.hypot(dx,dy), max=60;
  if(m>max){dx*=max/m;dy*=max/m;}
  knob.style.transform=`translate(${dx}px,${dy}px)`; mv.x=dx/max; mv.y=dy/max;
}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);setStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)setStick(e)});
const endStick=e=>{if(e.pointerId===sid){sid=null;mv.x=mv.y=0;knob.style.transform=''}};
stick.addEventListener('pointerup',endStick); stick.addEventListener('pointercancel',endStick);
$('atk').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
$('skl').addEventListener('pointerdown',e=>{e.preventDefault();skill()});
addEventListener('keydown',e=>{keys[e.code]=1; if(e.code==='KeyJ')attack(); if(e.code==='KeyK')skill();});
addEventListener('keyup',e=>keys[e.code]=0);

// ---------- Combate ----------
const dist=(a,b)=>Math.hypot(a.g.position.x-b.g.position.x,a.g.position.z-b.g.position.z);
function attack(){
  if(state!=='play'||P.atkT>0)return;
  P.atkT=.45; P.punch=1;
  if(dist(P,E)<2.4){ E.hp-=10; knock(E,P,6); hud(); }
}
function skill(){
  if(state!=='play'||P.sklT>0)return;
  P.sklT=3; P.punch=1;
  const m=new THREE.Mesh(new THREE.SphereGeometry(.5,16,16), mat(0xff7a00,{emissive:0xff4500,emissiveIntensity:2.5}));
  m.position.copy(P.g.position); m.position.y=1.8; scene.add(m);
  const d=new THREE.Vector3().subVectors(E.g.position,P.g.position).setY(0).normalize();
  balls.push({m,d,life:2});
}
function knock(to,from,f){
  const d=new THREE.Vector3().subVectors(to.g.position,from.g.position).setY(0).normalize();
  to.vx=d.x*f; to.vz=d.z*f;
}

// ---------- Loop ----------
const clock=new THREE.Clock();
function update(dt){
  t+=dt;
  const f=new THREE.Vector3().subVectors(E.g.position,P.g.position).setY(0).normalize();
  const r=new THREE.Vector3(-f.z,0,f.x);
  let ix=mv.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let iy=mv.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  const il=Math.hypot(ix,iy); if(il>1){ix/=il;iy/=il;}
  const sp=6;
  P.g.position.x+=(f.x*-iy+r.x*ix)*sp*dt + P.vx*dt;
  P.g.position.z+=(f.z*-iy+r.z*ix)*sp*dt + P.vz*dt;
  P.vx*=.88;P.vz*=.88;
  P.atkT-=dt; P.sklT-=dt; P.punch=Math.max(0,P.punch-dt*4);

  // IA do robô
  const ef=new THREE.Vector3().subVectors(P.g.position,E.g.position).setY(0);
  const ed=ef.length(); ef.normalize();
  if(ed>1.9){E.g.position.x+=ef.x*3.6*dt;E.g.position.z+=ef.z*3.6*dt;}
  E.g.position.x+=E.vx*dt;E.g.position.z+=E.vz*dt;E.vx*=.88;E.vz*=.88;
  E.atkT-=dt; E.punch=Math.max(0,E.punch-dt*4);
  if(ed<2.4&&E.atkT<=0){E.atkT=1.2;E.punch=1;P.hp-=6;knock(P,E,5);hud();}

  // limites da arena
  [P,E].forEach(c=>{const p=c.g.position,l=Math.hypot(p.x,p.z); if(l>R-1.5){p.x*=(R-1.5)/l;p.z*=(R-1.5)/l;}});

  // bolas de fogo
  balls=balls.filter(b=>{
    b.m.position.addScaledVector(b.d,16*dt); b.life-=dt;
    const dx=b.m.position.x-E.g.position.x, dz=b.m.position.z-E.g.position.z;
    if(Math.hypot(dx,dz)<1){E.hp-=25;knock(E,P,10);hud();scene.remove(b.m);return false;}
    if(b.life<=0){scene.remove(b.m);return false;} return true;
  });

  // animações e orientação
  P.g.rotation.y=Math.atan2(f.x,f.z); E.g.rotation.y=Math.atan2(ef.x,ef.z);
  const w=Math.sin(t*12)*(il>.1?.7:0);
  P.g.legL.rotation.x=w;P.g.legR.rotation.x=-w;P.g.armL.rotation.x=-w*.8;
  P.g.armR.rotation.x=P.punch>0?-Math.PI/2*P.punch:w*.8;
  const ew=Math.sin(t*10)*(ed>1.9?.7:0);
  E.g.legL.rotation.x=ew;E.g.legR.rotation.x=-ew;E.g.armL.rotation.x=-ew;
  E.g.armR.rotation.x=E.punch>0?-Math.PI/2*E.punch:ew;

  // câmera em 3ª pessoa
  const target=new THREE.Vector3(P.g.position.x-f.x*6.5,3.8,P.g.position.z-f.z*6.5);
  cam.position.lerp(target,Math.min(1,dt*6));
  cam.lookAt((P.g.position.x*.6+E.g.position.x*.4),1.5,(P.g.position.z*.6+E.g.position.z*.4));

  timeLeft-=dt; hud();
  if(E.hp<=0)finish(true);
  else if(P.hp<=0)finish(false);
  else if(timeLeft<=0)finish(P.hp>=E.hp);
}
function ambient(dt){
  t+=state==='play'?0:dt;
  scene.children.forEach(o=>{
    if(o.userData.fire)o.scale.y=1+Math.sin(performance.now()/110+o.position.x)*.25;
    if(o.userData.float!==undefined)o.position.y+=Math.sin(performance.now()/1500+o.userData.float)*.004;
  });
}
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

reset(); cam.position.set(0,6,16);
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);
  ambient(dt);
  if(state==='play')update(dt);
  else if(state==='menu'){ // câmera girando no menu
    const a=performance.now()/4000;
    cam.position.set(Math.cos(a)*14,5,Math.sin(a)*14); cam.lookAt(0,1.5,0);
    const f=P.g.position.clone().sub(E.g.position);
    P.g.rotation.y=Math.atan2(5,0)+Math.PI/2*-1; E.g.rotation.y=Math.PI/2;
  }
  renderer.render(scene,cam);
});
</script>
</body>
                 </html>
